services:
  app:
    build:
      context: ./docker
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: adhesion
      MYSQL_USER: adhesion
      MYSQL_PASSWORD: adhesion
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8026:8025"

volumes:
  db_data:
