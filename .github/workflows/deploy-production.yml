name: Deploy on Production Environment
run-name: "${{ github.actor }} is deploying on production environment 🚀"
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      since_ref:
        description: 'Base ref to diff from (e.g. b3256ae). Leave empty to use HEAD~1.'
        required: false
        default: ''

jobs:
  test:
    name: "PHPUnit tests"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: adhesion
          MYSQL_USER: adhesion
          MYSQL_PASSWORD: adhesion
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, gd
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare config
        run: |
          cp config.dist.php config.php
          sed -i 's/"ip_mysql"=>"database"/"ip_mysql"=>"127.0.0.1"/' config.php
          sed -i 's/"smtp_server"=>"mailpit"/"smtp_server"=>"localhost"/' config.php
      - name: Run tests
        run: vendor/bin/phpunit

  deploy:
    name: "Deploy on production server"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Get changed files
        id: changes
        run: |
          EXCLUDED="config.php|config.dist.php|composer.json|composer.lock|phpunit.xml|\.github/.*|tests/.*|vendor/.*|githooks/.*|\.gitignore|\.phpunit\.result\.cache|docker-compose\.yml|Makefile|docker/.*|fixtures\.php"
          BASE="${{ github.event.inputs.since_ref }}"
          if [ -z "$BASE" ]; then
            BASE="HEAD~1"
          fi
          echo "Diffing from $BASE to HEAD"
          ADDED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD | grep -vE "^($EXCLUDED)$" || true)
          DELETED=$(git diff --name-only --diff-filter=D "$BASE" HEAD | grep -vE "^($EXCLUDED)$" || true)
          echo "added<<EOF" >> $GITHUB_OUTPUT
          echo "$ADDED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "deleted<<EOF" >> $GITHUB_OUTPUT
          echo "$DELETED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -z "$ADDED" ] && [ -z "$DELETED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload changed files to FTP
        if: steps.changes.outputs.skip == 'false'
        run: |
          ADDED="${{ steps.changes.outputs.added }}"
          DELETED="${{ steps.changes.outputs.deleted }}"

          CMDS=""
          if [ -n "$DELETED" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              CMDS="$CMDS rm -f www/adhesion/$file;"
            done <<< "$DELETED"
          fi

          if [ -n "$ADDED" ]; then
            # Collect unique directories to create
            DIRS=""
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              dir=$(dirname "$file")
              if [ "$dir" != "." ]; then
                DIRS="$DIRS$dir"$'\n'
              fi
            done <<< "$ADDED"
            DIRS=$(echo "$DIRS" | sort -u)
            while IFS= read -r dir; do
              [ -z "$dir" ] && continue
              CMDS="$CMDS mkdir -p www/adhesion/$dir;"
            done <<< "$DIRS"

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              CMDS="$CMDS put $file -o www/adhesion/$file;"
            done <<< "$ADDED"
          fi

          if [ -n "$CMDS" ]; then
            lftp -u "${{ secrets.FTP_USERNAME_PROD }},${{ secrets.FTP_PASSWORD_PROD }}" "${{ secrets.FTP_HOST_PROD }}" -e "$CMDS bye"
          fi

  smoke-test:
    name: "Post-deploy smoke tests"
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check login page is accessible
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://lebusmagiquelille.fr/adhesion/login.php" --max-time 10)
          echo "Login page returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "SMOKE TEST FAILED: login page is not accessible"
            exit 1
          fi

      - name: Check main page redirects (auth required)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://lebusmagiquelille.fr/adhesion/main.php" --max-time 10)
          echo "Main page returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 500 ]; then
            echo "SMOKE TEST FAILED: main page returns 500"
            exit 1
          fi

      - name: Check static resources
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://lebusmagiquelille.fr/adhesion/mobile.css" --max-time 10)
          echo "CSS returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "SMOKE TEST FAILED: mobile.css is not accessible"
            exit 1
          fi
